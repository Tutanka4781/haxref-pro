<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaxRef Pro — Ligas</title>
<link rel="stylesheet" href="haxref.css">
<style>
/* ── Scrollbars estilizados ─────────────────────────────────── */
*{scrollbar-width:thin;scrollbar-color:#2a2a2a transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}

/* ── Layout ─────────────────────────────────────────────────── */
body{overflow:hidden;height:100vh;display:flex;flex-direction:column}
.lg-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.lg-title{font-size:11px;font-weight:900;letter-spacing:3px;color:#888;font-family:var(--font-display)}
.lg-title span{color:#444}
.lg-header-actions{margin-left:auto;display:flex;gap:8px}
.lg-back{background:transparent;border:1px solid #222;color:#555;font-size:10px;font-weight:900;letter-spacing:1px;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:var(--font-display);transition:.15s}
.lg-back:hover{color:#aaa;border-color:#444}

.lg-body{display:flex;flex:1;overflow:hidden}

/* ── Panel izquierdo — lista de ligas ───────────────────────── */
.lg-sidebar{width:200px;flex-shrink:0;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;overflow:hidden}
.lg-sidebar-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lg-sidebar-label{font-size:9px;font-weight:900;letter-spacing:2px;color:#444;font-family:var(--font-display)}
.lg-add-btn{background:transparent;border:1px solid #222;color:#666;font-size:14px;width:24px;height:24px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:.15s}
.lg-add-btn:hover{color:#aaa;border-color:#444}

.lg-list{flex:1;overflow-y:auto;padding:4px 8px}
.lg-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.12s;border:1px solid transparent;margin-bottom:2px}
.lg-item:hover{background:#111}
.lg-item.active{background:#0d0d18;border-color:#2a1a40}
.lg-item-name{flex:1;font-size:11px;font-weight:700;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-item.active .lg-item-name{color:#c4b5fd}
.lg-item-count{font-size:9px;color:#333;font-family:var(--font-mono)}
.lg-item-del{background:transparent;border:none;color:#333;font-size:12px;cursor:pointer;padding:2px 4px;border-radius:3px;line-height:1;opacity:0;transition:.12s}
.lg-item:hover .lg-item-del{opacity:1}
.lg-item-del:hover{color:var(--red)}

/* ── Panel derecho — detalle de liga ────────────────────────── */
.lg-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lg-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#333}
.lg-empty-icon{font-size:36px;opacity:.4}
.lg-empty-txt{font-size:11px;letter-spacing:2px;font-family:var(--font-display)}

.lg-detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lg-detail-head{padding:14px 18px 10px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid #141414}
.lg-detail-name{font-size:15px;font-weight:900;color:#ccc;letter-spacing:1px;font-family:var(--font-display);flex:1;cursor:pointer;padding:3px 6px;border-radius:5px;transition:.15s}
.lg-detail-name:hover{background:#111;color:#fff}
.lg-detail-name[contenteditable=true]{outline:1px solid #2a1a40;background:#0d0d18;color:#c4b5fd}
.lg-detail-actions{display:flex;gap:8px}
.lg-act-btn{background:transparent;border:1px solid #222;color:#555;font-size:10px;font-weight:900;letter-spacing:1px;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:var(--font-display);transition:.15s;white-space:nowrap}
.lg-act-btn:hover{color:#aaa;border-color:#444}
.lg-act-btn.primary{border-color:#2a1a40;color:#c4b5fd}
.lg-act-btn.primary:hover{background:#0d0d18}
.lg-act-btn.danger{border-color:rgba(255,42,42,.3);color:#ff6b6b}
.lg-act-btn.danger:hover{background:rgba(255,42,42,.07)}

/* ── Grid de equipos ────────────────────────────────────────── */
.lg-teams-area{flex:1;overflow-y:auto;padding:16px 18px}
.lg-teams-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lg-teams-label{font-size:9px;font-weight:900;letter-spacing:2px;color:#444;font-family:var(--font-display);flex:1}
.lg-teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}

.lg-team-card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;transition:.15s;cursor:default}
.lg-team-card:hover{border-color:#2a2a2a;background:#141414}
.lg-team-card .lg-team-logo{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:#0a0a0a;border:1px solid #1a1a1a;flex-shrink:0}
.lg-team-card .lg-team-logo img{width:100%;height:100%;object-fit:contain}
.lg-team-card .lg-team-logo .lg-logo-placeholder{font-size:22px;opacity:.3}
.lg-team-name{font-size:10px;font-weight:700;color:#888;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);letter-spacing:.5px}
.lg-team-card-actions{display:flex;gap:4px;opacity:0;transition:.12s}
.lg-team-card:hover .lg-team-card-actions{opacity:1}
.lg-team-card-btn{background:transparent;border:1px solid #222;color:#555;font-size:10px;padding:3px 7px;border-radius:5px;cursor:pointer;line-height:1;transition:.12s;font-family:var(--font-mono)}
.lg-team-card-btn:hover{color:#aaa;border-color:#444}
.lg-team-card-btn.del:hover{color:var(--red);border-color:rgba(255,42,42,.3)}

/* ── Botón añadir equipo ────────────────────────────────────── */
.lg-team-add{background:transparent;border:1px dashed #1e1e1e;border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.15s;min-height:110px}
.lg-team-add:hover{border-color:#333;background:#0d0d0d}
.lg-team-add-icon{font-size:20px;color:#333;line-height:1}
.lg-team-add-txt{font-size:9px;color:#333;letter-spacing:1.5px;font-family:var(--font-display)}

/* ── Animaciones de modales ─────────────────────────────────── */
@keyframes backdropIn  { from{opacity:0} to{opacity:1} }
@keyframes sheetSlideUp{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

.lg-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.lg-modal-backdrop.open{display:flex;animation:backdropIn .18s ease both}
.lg-modal-backdrop.open .lg-modal{animation:sheetSlideUp .22s cubic-bezier(.34,1.56,.64,1) both}
.lg-modal{background:#161616;border:1px solid #2e2e2e;border-radius:16px;padding:24px;width:320px;display:flex;flex-direction:column;gap:16px;animation:modalIn .22s var(--ease-spring) both}
.lg-modal-title{font-size:11px;font-weight:900;letter-spacing:2px;color:#555;font-family:var(--font-display)}
.lg-modal-input{background:#1a1a1a;border:1px solid #333;padding:12px 14px;color:#fff;border-radius:9px;outline:none;font-size:14px;width:100%;box-sizing:border-box;font-family:var(--font);transition:border-color .2s}
.lg-modal-input:focus{border-color:#4a2a6a}
.lg-modal-logo-preview{width:80px;height:80px;background:#0a0a0a;border:1px solid #222;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}
.lg-modal-logo-preview img{width:100%;height:100%;object-fit:contain}
.lg-modal-btns{display:flex;gap:8px}
.lg-modal-btns button{flex:1;padding:11px;border-radius:8px;font-weight:900;font-size:11px;letter-spacing:1px;cursor:pointer;border:none;font-family:var(--font-display);transition:filter .15s}
.lg-modal-confirm{background:linear-gradient(135deg,#363636,#5a5a5a);color:#fff}
.lg-modal-confirm:hover{filter:brightness(1.15)}
.lg-modal-cancel{background:#1a1a1a;color:#666;border:1px solid #2a2a2a!important}
.lg-modal-cancel:hover{color:#aaa}
.lg-modal-upload{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:#111;border:1px dashed #2a2a2a;border-radius:9px;cursor:pointer;color:#555;font-size:11px;font-family:var(--font-display);letter-spacing:1px;transition:.15s}
.lg-modal-upload:hover{border-color:#444;color:#888}

/* ── Toast ──────────────────────────────────────────────────── */
.lg-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:8px 16px;font-size:11px;color:#ccc;letter-spacing:1px;font-family:var(--font-display);opacity:0;transition:.25s;pointer-events:none;z-index:300;white-space:nowrap}
.lg-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="lg-header">
  <div class="lg-title">HAXREF <span>/</span> LIGAS</div>
  <div class="lg-header-actions">
    <button class="lg-act-btn" id="btn-import-liga" onclick="document.getElementById('liga-import-file').click()">⬆ IMPORTAR</button>
    <input type="file" id="liga-import-file" accept=".json" style="display:none" onchange="importLiga(event)">
    <button class="lg-back" onclick="window.location.href='index.html'">← VOLVER</button>
  </div>
</div>

<div class="lg-body">

  <!-- SIDEBAR — lista de ligas -->
  <div class="lg-sidebar">
    <div class="lg-sidebar-head">
      <div class="lg-sidebar-label">LIGAS</div>
      <button class="lg-add-btn" onclick="openNewLigaModal()" title="Nueva liga">+</button>
    </div>
    <div class="lg-list" id="lg-list"></div>
  </div>

  <!-- MAIN — detalle -->
  <div class="lg-main" id="lg-main">
    <div class="lg-empty" id="lg-empty">
      <div class="lg-empty-icon">🏆</div>
      <div class="lg-empty-txt">SELECCIONA UNA LIGA</div>
    </div>
    <div class="lg-detail" id="lg-detail" style="display:none">
      <div class="lg-detail-head">
        <div class="lg-detail-name" id="lg-detail-name" title="Clic para editar"></div>
        <div class="lg-detail-actions">
          <button class="lg-act-btn" onclick="exportLiga()">⬇ EXPORTAR</button>
          <button class="lg-act-btn danger" onclick="confirmDeleteLiga()">🗑 ELIMINAR LIGA</button>
        </div>
      </div>
      <div class="lg-teams-area">
        <div class="lg-teams-toolbar">
          <div class="lg-teams-label" id="lg-teams-label">EQUIPOS</div>
        </div>
        <div class="lg-teams-grid" id="lg-teams-grid"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL nueva liga / equipo -->
<div class="lg-modal-backdrop" id="lg-modal">
  <div class="lg-modal">
    <div class="lg-modal-title" id="lg-modal-title">NUEVA LIGA</div>
    <input class="lg-modal-input" id="lg-modal-input" placeholder="Nombre…" autocomplete="off">
    <!-- Preview logo (solo para equipo) -->
    <div id="lg-modal-logo-row" style="display:none;flex-direction:column;align-items:center;gap:8px">
      <div class="lg-modal-logo-preview" id="lg-modal-logo-preview">
        <span style="font-size:24px;opacity:.2">🛡</span>
      </div>
      <label class="lg-modal-upload" for="lg-modal-logo-input">📁 SUBIR LOGO</label>
      <input type="file" id="lg-modal-logo-input" accept="image/*,.svg,.webp,.avif" style="display:none" onchange="previewModalLogo(event)">
    </div>
    <div class="lg-modal-btns">
      <button class="lg-modal-cancel" onclick="closeModal()">CANCELAR</button>
      <button class="lg-modal-confirm" id="lg-modal-confirm">CREAR</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="lg-toast" id="lg-toast"></div>

<script>
// ══════════════════════════════════════════════════
//  STORAGE — clave: 'haxref_ligas'
//  Estructura: { [ligaId]: { id, name, teams: [{ id, name, logo }] } }
// ══════════════════════════════════════════════════
const LS_KEY = 'haxref_ligas';

function getLigas() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch { return {}; }
}
function saveLigas(ligas) {
  localStorage.setItem(LS_KEY, JSON.stringify(ligas));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── Estado ──────────────────────────────────────
let currentLigaId = null;
let modalMode = null; // 'liga' | 'team' | 'edit-team'
let modalLogoBase64 = null;
let editingTeamId = null;

// ── Render lista de ligas ────────────────────────
function renderList() {
  const ligas = getLigas();
  const list = document.getElementById('lg-list');
  list.innerHTML = '';
  const keys = Object.keys(ligas);
  if (!keys.length) {
    list.innerHTML = '<div style="padding:16px 10px;font-size:10px;color:#333;letter-spacing:1px;text-align:center">SIN LIGAS</div>';
    return;
  }
  keys.forEach(id => {
    const liga = ligas[id];
    const div = document.createElement('div');
    div.className = 'lg-item' + (id === currentLigaId ? ' active' : '');
    div.innerHTML = `
      <span class="lg-item-name">${escHtml(liga.name)}</span>
      <span class="lg-item-count">${liga.teams.length}</span>
      <button class="lg-item-del" onclick="event.stopPropagation();deleteLiga('${id}')" title="Eliminar">✕</button>`;
    div.onclick = () => selectLiga(id);
    list.appendChild(div);
  });
}

// ── Seleccionar liga ─────────────────────────────
function selectLiga(id) {
  currentLigaId = id;
  renderList();
  renderDetail();
}

// ── Render detalle ───────────────────────────────
function renderDetail() {
  const ligas = getLigas();
  const liga = ligas[currentLigaId];
  document.getElementById('lg-empty').style.display = liga ? 'none' : 'flex';
  document.getElementById('lg-detail').style.display = liga ? 'flex' : 'none';
  if (!liga) return;

  // Nombre editable
  const nameEl = document.getElementById('lg-detail-name');
  nameEl.textContent = liga.name;
  nameEl.onclick = () => startEditName(nameEl, liga);

  // Label
  document.getElementById('lg-teams-label').textContent =
    `EQUIPOS (${liga.teams.length})`;

  // Grid
  const grid = document.getElementById('lg-teams-grid');
  grid.innerHTML = '';

  liga.teams.forEach(team => {
    const card = document.createElement('div');
    card.className = 'lg-team-card';
    card.innerHTML = `
      <div class="lg-team-logo">
        ${team.logo
          ? `<img src="${team.logo}" alt="${escHtml(team.name)}">`
          : `<span class="lg-logo-placeholder">🛡</span>`}
      </div>
      <div class="lg-team-name" title="${escHtml(team.name)}">${escHtml(team.name)}</div>
      <div class="lg-team-card-actions">
        <button class="lg-team-card-btn" onclick="openEditTeamModal('${team.id}')" title="Editar">✏</button>
        <button class="lg-team-card-btn del" onclick="deleteTeam('${team.id}')" title="Eliminar">✕</button>
      </div>`;
    grid.appendChild(card);
  });

  // Botón añadir
  const addCard = document.createElement('div');
  addCard.className = 'lg-team-add';
  addCard.innerHTML = `<div class="lg-team-add-icon">+</div><div class="lg-team-add-txt">AÑADIR</div>`;
  addCard.onclick = () => openNewTeamModal();
  grid.appendChild(addCard);
}

// ── Editar nombre liga inline ────────────────────
function startEditName(el, liga) {
  el.contentEditable = true;
  el.focus();
  // Seleccionar todo
  const range = document.createRange();
  range.selectNodeContents(el);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);

  const save = () => {
    el.contentEditable = false;
    const newName = el.textContent.trim();
    if (newName && newName !== liga.name) {
      const ligas = getLigas();
      ligas[currentLigaId].name = newName;
      saveLigas(ligas);
      renderList();
      document.getElementById('lg-teams-label').textContent =
        `EQUIPOS (${ligas[currentLigaId].teams.length})`;
      toast('Nombre actualizado');
    } else {
      el.textContent = liga.name;
    }
  };
  el.onblur = save;
  el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } };
}

// ── MODALES ──────────────────────────────────────
function openNewLigaModal() {
  modalMode = 'liga';
  modalLogoBase64 = null;
  document.getElementById('lg-modal-title').textContent = 'NUEVA LIGA';
  document.getElementById('lg-modal-input').value = '';
  document.getElementById('lg-modal-input').placeholder = 'Nombre de la liga…';
  document.getElementById('lg-modal-logo-row').style.display = 'none';
  document.getElementById('lg-modal-confirm').textContent = 'CREAR';
  document.getElementById('lg-modal-confirm').onclick = confirmModal;
  document.getElementById('lg-modal').classList.add('open');
  setTimeout(() => document.getElementById('lg-modal-input').focus(), 80);
}

function openNewTeamModal() {
  modalMode = 'team';
  modalLogoBase64 = null;
  editingTeamId = null;
  document.getElementById('lg-modal-title').textContent = 'NUEVO EQUIPO';
  document.getElementById('lg-modal-input').value = '';
  document.getElementById('lg-modal-input').placeholder = 'Nombre del equipo…';
  document.getElementById('lg-modal-logo-row').style.display = 'flex';
  resetLogoPreview();
  document.getElementById('lg-modal-confirm').textContent = 'AÑADIR';
  document.getElementById('lg-modal-confirm').onclick = confirmModal;
  document.getElementById('lg-modal').classList.add('open');
  setTimeout(() => document.getElementById('lg-modal-input').focus(), 80);
}

function openEditTeamModal(teamId) {
  const ligas = getLigas();
  const liga  = ligas[currentLigaId];
  const team  = liga?.teams.find(t => t.id === teamId);
  if (!team) return;

  modalMode = 'edit-team';
  editingTeamId = teamId;
  modalLogoBase64 = team.logo || null;

  document.getElementById('lg-modal-title').textContent = 'EDITAR EQUIPO';
  document.getElementById('lg-modal-input').value = team.name;
  document.getElementById('lg-modal-input').placeholder = 'Nombre del equipo…';
  document.getElementById('lg-modal-logo-row').style.display = 'flex';

  const prev = document.getElementById('lg-modal-logo-preview');
  if (team.logo) {
    prev.innerHTML = `<img src="${team.logo}" style="width:100%;height:100%;object-fit:contain">`;
  } else {
    resetLogoPreview();
  }

  document.getElementById('lg-modal-confirm').textContent = 'GUARDAR';
  document.getElementById('lg-modal-confirm').onclick = confirmModal;
  document.getElementById('lg-modal').classList.add('open');
  setTimeout(() => document.getElementById('lg-modal-input').focus(), 80);
}

function resetLogoPreview() {
  document.getElementById('lg-modal-logo-preview').innerHTML =
    '<span style="font-size:24px;opacity:.2">🛡</span>';
  document.getElementById('lg-modal-logo-input').value = '';
}

function previewModalLogo(e) {
  const file = e.target.files[0];
  if (!file) return;
  // Comprimir a WebP vía canvas para reducir peso
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // Máximo 128×128px, calidad 0.85 WebP
      const MAX = 128;
      const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // WebP si disponible, fallback PNG
      const compressed = canvas.toDataURL('image/webp', 0.85) ||
                         canvas.toDataURL('image/png');
      modalLogoBase64 = compressed;
      document.getElementById('lg-modal-logo-preview').innerHTML =
        `<img src="${compressed}" style="width:100%;height:100%;object-fit:contain">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function confirmModal() {
  const name = document.getElementById('lg-modal-input').value.trim();
  if (!name) {
    document.getElementById('lg-modal-input').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('lg-modal-input').style.borderColor = '#333', 700);
    return;
  }
  const ligas = getLigas();

  if (modalMode === 'liga') {
    const id = uid();
    ligas[id] = { id, name, teams: [] };
    saveLigas(ligas);
    closeModal();
    renderList();
    selectLiga(id);
    toast(`Liga "${name}" creada`);

  } else if (modalMode === 'team') {
    if (!currentLigaId || !ligas[currentLigaId]) return;
    const id = uid();
    ligas[currentLigaId].teams.push({ id, name, logo: modalLogoBase64 || null });
    saveLigas(ligas);
    closeModal();
    renderDetail();
    // También guardar en saved_team_logos para compatibilidad con haxref.js
    _syncLogoToMain(name, modalLogoBase64);
    toast(`Equipo "${name}" añadido`);

  } else if (modalMode === 'edit-team') {
    if (!currentLigaId || !ligas[currentLigaId]) return;
    const team = ligas[currentLigaId].teams.find(t => t.id === editingTeamId);
    if (!team) return;
    const oldName = team.name;
    team.name = name;
    if (modalLogoBase64) team.logo = modalLogoBase64;
    saveLigas(ligas);
    closeModal();
    renderDetail();
    _syncLogoToMain(name, team.logo);
    // Si cambió nombre, actualizar clave en saved_team_logos
    if (oldName !== name) _renameLogoInMain(oldName, name, team.logo);
    toast('Equipo actualizado');
  }
}

function closeModal() {
  document.getElementById('lg-modal').classList.remove('open');
  modalLogoBase64 = null;
  editingTeamId = null;
}

document.getElementById('lg-modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmModal();
  if (e.key === 'Escape') closeModal();
});
document.getElementById('lg-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('lg-modal')) closeModal();
});

// ── Eliminar equipo ──────────────────────────────
function deleteTeam(teamId) {
  const ligas = getLigas();
  const liga = ligas[currentLigaId];
  if (!liga) return;
  const team = liga.teams.find(t => t.id === teamId);
  if (!team) return;
  if (!confirm(`¿Eliminar "${team.name}" de la liga?`)) return;
  liga.teams = liga.teams.filter(t => t.id !== teamId);
  saveLigas(ligas);
  renderDetail();
  toast(`"${team.name}" eliminado`);
}

// ── Eliminar liga ────────────────────────────────
function deleteLiga(id) {
  const ligas = getLigas();
  const liga = ligas[id];
  if (!liga) return;
  if (!confirm(`¿Eliminar la liga "${liga.name}" y todos sus equipos?`)) return;
  delete ligas[id];
  saveLigas(ligas);
  if (currentLigaId === id) {
    currentLigaId = null;
    renderDetail();
  }
  renderList();
  toast('Liga eliminada');
}

function confirmDeleteLiga() { if (currentLigaId) deleteLiga(currentLigaId); }

// ── Exportar / Importar ──────────────────────────
function exportLiga() {
  const ligas = getLigas();
  const liga = ligas[currentLigaId];
  if (!liga) return;
  const data = { _type: 'haxref_liga', _version: '1.0', _date: new Date().toISOString(), ...liga };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `liga_${liga.name.toLowerCase().replace(/\s+/g,'_')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`"${liga.name}" exportada`);
}

function importLiga(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try { data = JSON.parse(ev.target.result); }
    catch { alert('Archivo JSON inválido.'); return; }
    if (data._type !== 'haxref_liga') { alert('Este archivo no es una liga de HaxRef.'); return; }

    const ligas = getLigas();
    // Buscar liga existente con mismo nombre
    const existing = Object.values(ligas).find(l => l.name === data.name);
    if (existing) {
      if (!confirm(`Ya existe una liga llamada "${data.name}".\n¿Reemplazarla?`)) return;
      delete ligas[existing.id];
    }
    const id = data.id || uid();
    ligas[id] = { id, name: data.name, teams: data.teams || [] };
    saveLigas(ligas);
    // Sincronizar logos a saved_team_logos
    ligas[id].teams.forEach(t => { if (t.logo) _syncLogoToMain(t.name, t.logo); });
    renderList();
    selectLiga(id);
    toast(`Liga "${data.name}" importada`);
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Sync con saved_team_logos de haxref.js ───────
function _syncLogoToMain(name, logo) {
  if (!name || !logo) return;
  const logos = JSON.parse(localStorage.getItem('saved_team_logos') || '{}');
  logos[name.toLowerCase().trim()] = logo;
  localStorage.setItem('saved_team_logos', JSON.stringify(logos));
}
function _renameLogoInMain(oldName, newName, logo) {
  const logos = JSON.parse(localStorage.getItem('saved_team_logos') || '{}');
  delete logos[oldName.toLowerCase().trim()];
  if (logo) logos[newName.toLowerCase().trim()] = logo;
  localStorage.setItem('saved_team_logos', JSON.stringify(logos));
}

// ── Toast ────────────────────────────────────────
let _toastTimer = null;
function toast(msg) {
  const el = document.getElementById('lg-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Helper ───────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ─────────────────────────────────────────
renderList();
</script>
